<!DOCTYPE html>
<html>
<head>
  <title>8章課題</title>
  <meta name="description" content="このページは8章の課題です。">
  <meta charset="UTF-8">
</head>
<body>
  <header>
    <h1>SAMURAIニュース</h1>
    <nav>
    <a href="#">ホーム</a>
    <a href="#">社会</a>
    <a href="#">経済</a>
    <a href="#">スポーツ</a>
    <a href="#">テクノロジー</a>
  </nav>
  </header>
  <main>
    <article>
      <h2>社会</h2>
      <section>
        <!-- 社会のセクションのHTMLを記述してください -->
        <h3>和菓子店も「トリックオアトリート！」</h3>
        <p>
        日本でも年々人気の高まるハロウィン。
        今年は大手和菓子店5社がハロウィン向けの和菓子セットを共同開発しました。
        </p>
        <audio controls> 
         <source src="ichi.mp3" type="audio/mpeg">
        </audio>
       </section>
      <section>
        <h3>私のおすすめ和菓子アンケートフォーム</h3>
        <form>
          <p> 氏名
            <label for="name">氏名</label>
            <input id="name" type="text" name="name" placeholder="名前を入力してください"/>
          </p>
          <p> 年代
            <label for="name">年代</label>
          　<select id="age" name="age"
            <option value="">選択してください</option>
             <option>10代以下</option>
             <option>20代</option>
             <option>30代</option>
             <option>40代</option>
             <option>50代以上</option>
            </select>
          </p>
          <p> 性別
          　　<label><input type="radio" name="gender">男性</label>
             <label><input type="radio" name="gender">女性</label>
             <label><input type="radio" name="gender">その他</label>
          </p>
          <p>おすすめ和菓子の名称
              <div class="row">
             <label for="wagashi">おすすめ</label>
             <input id="wagashi" type="text" name="wagashi" placeholder="例：みたらし団子" />
        </div>

      <div class="row" style="align-items:flex-start;">
        <label for="reason">理由</label>
        <textarea id="reason" name="reason"></textarea>
      </div>

      <div class="row">
        <label></label>
        <label><input type="checkbox" name="agree" /> 個人情報保護方針に同意する</label>
      </div>

      <div class="buttons">
        <input type="submit" value="送信" />
        <input type="reset" value="リセット" />
      </div>
    </form>

    <!-- テクノロジー -->
    <h2>テクノロジー</h2>
    <h3>SAMURAIが新しい動画をリリース</h3>
    <p>
      SAMURAI公式YouTubeで新しい動画がリリースされました。<br />
      動画の内容はHTML/CSSの解説です。
    </p>

    <footer>©SAMURAIニュース</footer>
  </div>
</body>
</html>
