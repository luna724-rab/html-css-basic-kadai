<!DOCTYPE html>
<html>
<head>
  <title>8章課題</title>
  <meta name="description" content="このページは8章の課題です。">
  <meta charset="UTF-8">
</head>
<body>
  <header>
    <h1>SAMURAIニュース</h1>
    <nav>
    <a href="#">ホーム</a>
    <a href="#">社会</a>
    <a href="#">経済</a>
    <a href="#">スポーツ</a>
    <a href="#">テクノロジー</a>
  </nav>
  </header>
  <main>
    <article>
      <h2>社会</h2>
      <section>
        <!-- 社会のセクションのHTMLを記述してください -->
        <h3>和菓子店も「トリックオアトリート！」</h3>
        <p>
        日本でも年々人気の高まるハロウィン。
        今年は大手和菓子店5社がハロウィン向けの和菓子セットを共同開発しました。
        </p>
        <audio controls> 
         <source src="ichi.mp3" type="audio/mpeg">
        </audio>
       </section>
      <section>
        <h3>私のおすすめ和菓子アンケートフォーム</h3>
        <form>
          <p> 氏名 
            <label for="name">氏名</label>
            <input id="name" type="text" name="name" placeholder="名前を入力してください”/>
          </p>
          <p> 年代
          　<select>
             <option>10代以下</option>
             <option>20代</option>
             <option>30代</option>
             <option>40代</option>
             <option>50代以上</option>
            </select>
          </p>
          <p> 性別
          　　<label><input type="radio" name="gender">男性</label>
             <label><input type="radio" name="gender">女性</label>
             <label><input type="radio" name="gender">その他</label>
          </p>
          <p>おすすめ和菓子の名称
             <input type="text" palaceholder="例：みたらし団子">
          </p>
          <p> おすすめする理由<br>
             <textarea></textarea>
          </p>
          <p>
            <label>
             <input type="checkbox">
             個人情報保護方針に同意する
            </label>
          </p>
          <p>
           <input type="submit" value="送信”>
           <input type="submit" value="リセット”>
          </p>
        </form>
      </section>
    </article>
    <article>
      <h3>テクノロジー</h3>
      <section>
       <h3>	SAMURAIが新しい動画をリリース
        <p>SAMURAI公式YouTubeで新しい動画がリリースされました。<br>
        動画の内容はHTML/CSSの解説です。
        </p>
      </section>
    </article>
  </main>
  <footer>
    <p>&copy;SAMURAIニュース</p>
  </footer>
</body>
</html>
