<!DOCTYPE html>
<html>

<head>
  <title>8章課題</title>
  <meta name="description" content="このページは8章の課題です。">
  <meta charset="UTF-8">
</head>

<body>
  <header>
    <h1>SAMURAIニュース</h1>
    <nav>
      <a href="https://www.sejuku.net/">ホーム</a>
      <a href="https://www.sejuku.net/">社会</a>
      <a href="https://www.sejuku.net/">経済</a>
      <a href="https://www.sejuku.net/">スポーツ</a>
      <a href="https://www.sejuku.net/">テクノロジー</a>
    </nav>
  </header>

  <main>
    <article>
        <h2>社会</h2>
        <section>
        <h3>和菓子店も「トリックオアトリート！」</h3>
        <p>
          日本でも年々人気の高まるハロウィン。
          今年は大手和菓子店5社がハロウィン向けの和菓子セットを共同開発しました。
        </p>

        <audio controls>
          <source src="ichi.mp3" type="audio/mpeg">
        </audio>
      </section>

    <section>
      <h3>私のおすすめ和菓子アンケートフォーム</h3>
      <form>
          <label for="name">氏名</label>
          <input type="text" id="name" name="name" placeholder="名前を入力してください">
          <br>
          <label for="age">年代</label>
          <select id="age" name="age">
            <option value="">選択してください</option>
            <option>10代以下</option>
            <option>20代</option>
            <option>30代</option>
            <option>40代</option>
          </select>
          <br>
          <label><input type="radio" name="gender">男性</label>
          <label><input type="radio" name="gender">女性</label>
          <label><input type="radio" name="gender">その他</label>
          <br>
        <label>おすすめ和菓子の名称</label>
            <input type="text" name="wagashi" placeholder="例：みたらし団子" >
            <br>

            <label for="reason">理由</label>
            <textarea id="reason" name="reason"></textarea>
            <br>

            <label>個人情報保護方針に同意する</label>
              <input type="checkbox" name="agree" /> 
            <br>

            <input type="submit" value="送信" />
            <input type="reset" value="リセット" />

      </form>
    </section>
    </article>

      <article>
        <h2>テクノロジー</h2>
        <section>
          <h3>SAMURAIが新しい動画をリリース</h3>
          <p>
            SAMURAI公式YouTubeで新しい動画がリリースされました。<br />
            動画の内容はHTML/CSSの解説です。
          </p>
        </section>
      </article>
  </main>

    <footer>
        <p>&copy;SAMURAIニュース</p>
    </footer>
</body>

</html>
